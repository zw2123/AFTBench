profile: ablation_no_effects
seed: 42
output_dir: artifacts/ablations/no_effects
base_config: configs/pilot.yaml

description: >
  Ablation: removes the effect verification primitives from I5.
  Agents cannot verify whether an effect actually occurred after
  executing an action. Tests whether post-effect verification is
  critical for handling LOST_RESPONSE_AFTER_EFFECT faults.

removed_primitives:
  - state.verify_effect
  - state.get_postconditions
  - state.snapshot

interfaces:
  - I0
  - I1
  - I2
  - I3
  - I4
  # I5 with effect verification removed — agents execute but cannot confirm

worlds:
  - enterprise_records
  - long_running_jobs
  - large_catalog
  - external_actions

faults: null  # inherit from base
seeds: [42, 123, 456]
resumable: true
