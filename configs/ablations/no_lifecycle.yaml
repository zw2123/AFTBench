output_dir: artifacts/ablations/no_lifecycle
base_config: configs/pilot.yaml

description: >
  Ablation: removes the lifecycle management primitives from I5.
  Agents cannot cancel, resume, or check status of running jobs.
  Tests whether lifecycle awareness is critical for long-running workflows.

