  - job.cancel
  - job.resume
  - job.get_status
  - job.verify_integrity

interfaces:
  - I0
  - I1
  - I2
  - I3
  - I4
  # I5 with lifecycle removed — submit and read remain, no cancel/resume/status

worlds:
  - enterprise_records
  - long_running_jobs
  - large_catalog
  - external_actions

faults: null  # inherit from base
seeds: [42, 123, 456]
resumable: true
