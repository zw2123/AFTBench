profile: llm_pilot
seed: 42
output_dir: artifacts/llm_pilot
worlds:
  - enterprise_records
  - long_running_jobs
  - large_catalog
  - external_actions

interfaces:
  - I0
  - I5

faults:
  - none
  - lost_response_after_effect

max_tasks_per_world: 3
seeds: [42]

agent: llm
llm_model: qwen3.7-plus
llm_api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
llm_cost_limit_usd: 2.0
llm_call_limit: 100
llm_temperature: 0.0

resumable: true
resume_from: null

task_overrides: {}

analysis:
  compute_confidence_intervals: false
  confidence_level: 0.95
  bootstrap_samples: 100

report:
  format: [csv, json]
  include_trace_examples: false
  max_trace_examples_per_cell: 0
