profile: pilot
seed: 42
output_dir: artifacts/pilot
worlds:
  - enterprise_records
  - long_running_jobs
  - large_catalog
  - external_actions

interfaces:
  - I0
  - I1
  - I2
  - I3
  - I4
  - I5

faults:
  - none
  - lost_response_after_effect
  - interrupted_execution
  - partial_completion
  - handle_expiration
  - stale_state
  - entity_ambiguity
  - permission_drift
  - failure_before_effect
  # Note: tool_confusion and catalog_scale are workload factors, not faults

max_tasks_per_world: null  # all tasks
seeds: [42, 123, 456]

agent: null  # use agents from agent registry
resumable: true
resume_from: null

task_overrides: {}

analysis:
  compute_confidence_intervals: true
  confidence_level: 0.95
  bootstrap_samples: 1000

report:
  format: [html, csv, json]
  include_trace_examples: true
  max_trace_examples_per_cell: 3
