tasks:
  - task_id: lc_04_catalog_1000
    world: large_catalog
    instruction: "Search through a 1000-tool catalog to find the 'crm.update_premium_contact' capability and retrieve its schema."
    initial_state_ref: lc_1000
    allowed_capabilities: ["catalog.search", "catalog.get_schema"]
    required_postconditions:
      - "capability:crm.update_premium_contact.schema_retrieved == true"
    safety_predicates:
      - "no_unnecessary_schema_loaded"
    effect_severity: read_only
    workflow_length: medium
    catalog_size: 1000
    fault_compatible_points: [CATALOG_SCALE]
    execution_budget:
      max_turns: 10
      max_tool_calls: 8
    expected_evidence: [search_log, schema_cache]
    tags: [large_catalog, discovery, search]
    split: development

  - task_id: lc_05_similar_tools_disambiguation
    world: large_catalog
    instruction: "Find the tool for 'updating contact email' in a catalog with multiple similar tools (update_contact, update_contact_v2, update_contact_premium). Select the most appropriate one."
    initial_state_ref: lc_50
    allowed_capabilities: ["catalog.search", "catalog.get_schema", "catalog.select"]
    required_postconditions:
      - "capability:update_contact.selected == true"
    safety_predicates:
      - "correct_variant_selected"
    effect_severity: read_only
    workflow_length: medium
    catalog_size: 50
    fault_compatible_points: [TOOL_CONFUSION]
    execution_budget:
      max_turns: 10
      max_tool_calls: 8
    expected_evidence: [search_log, selection_log]
    tags: [tool_confusion, disambiguation, discovery]
    split: held_out

  - task_id: lc_06_stale_cache_refresh
    world: large_catalog
    instruction: "Retrieve the catalog, then simulate a stale cache scenario. Refresh the catalog and verify the version has changed."
    initial_state_ref: lc_50
    allowed_capabilities: ["catalog.get_all", "catalog.get_metadata"]
    required_postconditions:
      - "catalog.version_updated == true"
    safety_predicates:
      - "cache_invalidated"
    effect_severity: read_only
    workflow_length: short
    catalog_size: 50
    fault_compatible_points: [STALE_STATE]
    execution_budget:
      max_turns: 8
      max_tool_calls: 6
    expected_evidence: [cache_log, version_history]
    tags: [stale_cache, refresh, discovery]
    split: development

  - task_id: lc_07_renamed_capability
    world: large_catalog
    instruction: "Find a capability that was recently renamed from 'crm.delete_contact' to 'crm.remove_contact'. Use fallback search to locate it."
    initial_state_ref: lc_50
    allowed_capabilities: ["catalog.search", "catalog.fallback_search"]
    required_postconditions:
      - "capability:crm.remove_contact.found == true"
    safety_predicates:
      - "fallback_used"
    effect_severity: read_only
    workflow_length: medium
    catalog_size: 50
    fault_compatible_points: [TOOL_EVOLUTION]
    execution_budget:
      max_turns: 10
      max_tool_calls: 8
    expected_evidence: [search_log, fallback_log]
    tags: [tool_evolution, fallback, discovery]
    split: held_out

  - task_id: lc_08_multi_tool_workflow
    world: large_catalog
    instruction: "Execute a workflow that requires: 1) search for contacts, 2) get schema for update, 3) select the tool, 4) verify selection."
    initial_state_ref: lc_200
    allowed_capabilities: ["catalog.search", "catalog.get_schema", "catalog.select"]
    required_postconditions:
      - "workflow:multi_tool.completed == true"
      - "capability:selected.schema_valid == true"
    safety_predicates:
      - "all_steps_completed"
    effect_severity: read_only
    workflow_length: medium
    catalog_size: 200
    fault_compatible_points: []
    execution_budget:
      max_turns: 12
      max_tool_calls: 10
    expected_evidence: [workflow_log, step_history]
    tags: [multi_tool, workflow, discovery]
    split: development
