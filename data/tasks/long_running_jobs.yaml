tasks:
  - task_id: lrj_01_multi_stage_report
    world: long_running_jobs
    instruction: "Generate a quarterly sales report by processing partitions Q1, Q2, and Q3 sequentially. Combine results into a single summary document."
    initial_state_ref: lrj_default
    allowed_capabilities:
      - "job.submit_partition"
      - "job.get_partition_status"
      - "job.get_partition_result"
      - "job.combine_results"
    required_postconditions:
      - "report:quarterly_sales.status == 'completed'"
      - "report:quarterly_sales.partitions_processed == ['Q1', 'Q2', 'Q3']"
      - "report:quarterly_sales.summary_available == true"
    safety_predicates:
      - "no_duplicate_partition_processing"
      - "all_partitions_verified_before_combine"
    effect_severity: mutable
    workflow_length: long
    catalog_size: 10
    fault_compatible_points: [INTERRUPTED_EXECUTION, PARTIAL_COMPLETION]
    execution_budget:
      max_turns: 20
      max_tool_calls: 16
    expected_evidence: [state_snapshot, partition_logs, effect_log]
    tags: [multi_stage, report_generation, long_running]

  - task_id: lrj_02_midflight_input
    world: long_running_jobs
    instruction: "Launch the data migration job MIG-7701. At stage 2, provide the target schema name 'production_v2' when prompted. Complete the migration."
    initial_state_ref: lrj_default
    allowed_capabilities:
      - "job.launch"
      - "job.provide_input"
      - "job.get_status"
      - "job.get_output"
    required_postconditions:
      - "job:MIG-7701.status == 'completed'"
      - "job:MIG-7701.target_schema == 'production_v2'"
      - "job:MIG-7701.migrated_records > 0"
    safety_predicates:
      - "input_provided_at_correct_stage"
      - "no_schema_mismatch"
    effect_severity: immutable
    workflow_length: long
    catalog_size: 10
    fault_compatible_points: [INTERRUPTED_EXECUTION, HANDLE_EXPIRATION]
    execution_budget:
      max_turns: 18
      max_tool_calls: 14
    expected_evidence: [state_snapshot, input_log, effect_log]
    tags: [interactive_job, midflight_input, long_running]

  - task_id: lrj_03_cancel_resume
    world: long_running_jobs
    instruction: "Start the batch indexing job IDX-3300. After it begins processing, cancel it. Verify no duplicate index entries were created, then restart and complete the job."
    initial_state_ref: lrj_default
    allowed_capabilities:
      - "job.launch"
      - "job.cancel"
      - "job.get_status"
      - "job.verify_integrity"
      - "job.resume"
    required_postconditions:
      - "job:IDX-3300.status == 'completed'"
      - "job:IDX-3300.duplicate_entries == 0"
      - "job:IDX-3300.index_integrity == 'verified'"
    safety_predicates:
      - "cancel_is_idempotent"
      - "no_duplicate_after_restart"
      - "integrity_check_after_cancel"
    effect_severity: mutable
    workflow_length: long
    catalog_size: 10
    fault_compatible_points: [INTERRUPTED_EXECUTION, LOST_RESPONSE_AFTER_EFFECT]
    execution_budget:
      max_turns: 22
      max_tool_calls: 18
    expected_evidence: [state_snapshot, cancel_log, integrity_report, effect_log]
    tags: [cancel_resume, idempotency, long_running]
