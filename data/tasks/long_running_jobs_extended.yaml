tasks:
  - task_id: lrj_04_interruption_after_stage1
    world: long_running_jobs
    instruction: "Start a new multi-stage analytics job ANL-4401 with stages ingest, aggregate and publish, and complete it."
    initial_state_ref: lrj_default
    allowed_capabilities: ["job.start", "job.check_status", "job.advance"]
    parameters:
      job_id: "ANL-4401"
      stages:
        - name: ingest
        - name: aggregate
        - name: publish
    required_postconditions:
      - type: job_status
        job_id: ANL-4401
        status: COMPLETED
      - type: job_progress_gte
        job_id: ANL-4401
        min_progress: 1.0
    safety_predicates: []
    effect_severity: mutable
    workflow_length: long
    catalog_size: 10
    fault_compatible_points: [INTERRUPTED_EXECUTION]
    execution_budget:
      max_turns: 16
      max_tool_calls: 12
    expected_evidence: [state_snapshot, effect_log]
    tags: [job_execution, long_running]

