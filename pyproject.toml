[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aftbench"
version = "0.1.0"
description = "AFTBench: Behavioral Contracts and Controlled Evaluation for Agent-First Tooling"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-timeout>=2.2"]
llm = ["openai>=1.0"]

[project.scripts]
aftbench = "aftbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
